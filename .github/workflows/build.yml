name: Build modulo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/ipad/mod app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://api.xposed.info/")
              }
          }
          rootProject.name = "IPadPlayer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "ipad.mod"
              compileSdk = 34
              defaultConfig {
                  applicationId = "ipad.mod"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="iPad Player"
                  android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Player em duas metades (paisagem)" />
                  <meta-data android:name="xposedminversion" android:value="93" />
              </application>
          </manifest>
          EOF

          echo "ipad.mod.Hook" > app/src/main/assets/xposed_init

          cat > app/src/main/java/ipad/mod/Hook.kt <<'EOF'
          package ipad.mod

          import android.content.res.Configuration
          import android.view.View
          import android.view.ViewGroup
          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.XC_MethodHook
          import de.robv.android.xposed.XposedBridge
          import de.robv.android.xposed.XposedHelpers
          import de.robv.android.xposed.callbacks.XC_LoadPackage
          import java.lang.ref.WeakReference
          import java.util.WeakHashMap

          class Hook : IXposedHookLoadPackage {

              private val roots = WeakHashMap<View, Boolean>()
              private val watched = WeakHashMap<View, View>()
              private val tokens = WeakHashMap<View, Int>()
              private var playerRef: WeakReference<View>? = null

              // ids do player (versao 7.1): capa, titulo, progresso e controles
              private val playerIds = intArrayOf(
                  0x7F0A0118, 0x7F0A0407, 0x7F0A011D, 0x7F0A0345, 0x7F0A0700,
                  0x7F0A06FB, 0x7F0A026D, 0x7F0A09A1, 0x7F0A0718, 0x7F0A08B6,
                  0x7F0A08EC, 0x7F0A083E, 0x7F0A08C1, 0x7F0A08C3
              )

              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
                  if (lpparam.packageName != "com.apple.android.music") return
                  // q8.na = player (layout-w600dp), q8.Y4 = folha da letra (versao 7.1)
                  hookBinding(lpparam, "q8.na", false)
                  hookBinding(lpparam, "q8.Y4", true)
              }

              private fun hookBinding(lpparam: XC_LoadPackage.LoadPackageParam, cls: String, right: Boolean) {
                  try {
                      XposedHelpers.findAndHookConstructor(
                          cls, lpparam.classLoader,
                          "androidx.databinding.f", View::class.java,
                          object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  try {
                                      setup(param.args[1] as View, right)
                                  } catch (t: Throwable) {
                                      XposedBridge.log("ipad.mod setup erro ($cls): $t")
                                  }
                              }
                          })
                      XposedBridge.log("ipad.mod: hook instalado em $cls")
                  } catch (t: Throwable) {
                      XposedBridge.log("ipad.mod: falha ao hookar $cls: $t")
                  }
              }

              private fun setup(root: View, right: Boolean) {
                  if (roots.put(root, true) != null) return
                  if (!right) playerRef = WeakReference(root)
                  root.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                      override fun onViewAttachedToWindow(v: View) {
                          watch(v, right)
                          if (right) startTick(v)
                      }
                      override fun onViewDetachedFromWindow(v: View) {}
                  })
                  if (root.parent != null) {
                      watch(root, right)
                      if (right && root.isAttachedToWindow) startTick(root)
                  }
              }

              private fun watch(root: View, right: Boolean) {
                  val parent = root.parent as? View ?: return
                  if (watched[root] !== parent) {
                      watched[root] = parent
                      parent.addOnLayoutChangeListener { _, _, _, _, _, _, _, _, _ -> adjust(root, right) }
                  }
                  adjust(root, right)
              }

              private fun isWide(v: View): Boolean {
                  val cfg = v.resources.configuration
                  return cfg.orientation == Configuration.ORIENTATION_LANDSCAPE && cfg.smallestScreenWidthDp >= 600
              }

              private fun adjust(root: View, right: Boolean) {
                  val parent = root.parent as? View ?: return
                  val lp = root.layoutParams ?: return
                  val on = isWide(root) && parent.width > 0
                  val w = if (on) parent.width / 2 else ViewGroup.LayoutParams.MATCH_PARENT
                  val tx = if (on && right) (parent.width - w).toFloat() else 0f
                  if (lp.width != w) {
                      lp.width = w
                      root.layoutParams = lp
                  }
                  if (root.translationX != tx) root.translationX = tx
              }

              // Enquanto a letra esta na tela, forca o player a continuar visivel
              private fun startTick(lyrics: View) {
                  val t = (tokens[lyrics] ?: 0) + 1
                  tokens[lyrics] = t
                  tick(lyrics, t)
              }

              private fun tick(lyrics: View, t: Int) {
                  if (tokens[lyrics] != t || !lyrics.isAttachedToWindow) return
                  try {
                      restorePlayer()
                  } catch (e: Throwable) {
                  }
                  lyrics.postOnAnimation { tick(lyrics, t) }
              }

              private fun restorePlayer() {
                  val p = playerRef?.get() ?: return
                  if (!isWide(p)) return
                  show(p)
                  for (id in playerIds) {
                      val v = p.findViewById<View>(id)
                      if (v != null) show(v)
                  }
              }

              private fun show(v: View) {
                  if (v.visibility != View.VISIBLE) v.visibility = View.VISIBLE
                  if (v.alpha != 1f) v.alpha = 1f
                  if (v.translationX != 0f) v.translationX = 0f
                  if (v.translationY != 0f) v.translationY = 0f
                  if (v.scaleX != 1f) v.scaleX = 1f
                  if (v.scaleY != 1f) v.scaleY = 1f
              }
          }
          EOF

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: modulo-ipad
          path: app/build/outputs/apk/debug/app-debug.apk
